version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
      POSTGRES_DB: activation
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://activation:activation@db:5432/activation?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
